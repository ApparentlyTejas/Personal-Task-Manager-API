[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["frontend", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501", # line length is enforced via the formatter/line-length setting, not worth hard-failing on
    "B008", # FastAPI's `Depends(...)` in argument defaults is the framework's documented, intended
            # pattern (see fastapi.tiangolo.com/tutorial/dependencies), not a real mutable-default bug
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
exclude = ["frontend/", "\\.venv/"]
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.coverage.run]
omit = ["tests/*"]
# SQLAlchemy's async engine bridges to the sync asyncpg driver via greenlet
# switches (greenlet_spawn). Without this, coverage's sys.settrace hook does
# not follow execution into those greenlets, so every line that runs inside
# an `await session.execute(...)` / `await session.commit()` call -- i.e.
# almost the entire app -- is silently (and incorrectly) reported as
# uncovered even when tests exercise it.
concurrency = ["greenlet"]
